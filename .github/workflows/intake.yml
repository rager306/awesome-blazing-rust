name: Intake

# Card intake: a "Suggest a project" issue (label: card-intake) makes the agent
# research the suggested repository and return the card TEXT; the PIPELINE
# writes it into the "## Candidates" section of README.md, regenerates every
# derived artifact with abr, runs the gates, and only then opens a draft PR.
#
# Why the split: the agent used to hold Edit/Write/Bash itself. Model sessions
# intermittently come up with an empty deferred-tool registry (observed
# 2026-10-27: identical command, same CLI version, no file tools), which
# silently produced "No card produced" runs. Research needs tools; writing does
# not - and the pipeline writing is deterministic, auditable and injectable
# only into the draft zone.
#
# Gates run before the PR exists: `abr check` + `awesome-lint` at the exact
# commit the PR would carry; a card that fails never becomes a PR.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to process"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  # One group per issue: a shared group makes GitHub cancel the older PENDING
  # run when discovery dispatches several intakes at once.
  group: intake-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  draft-card:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'card-intake'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build abr CLI
        run: cd cli && cargo build --release
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.311
      - name: Freshness and duplicate gate (pipeline-side, deterministic)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          set -o pipefail
          BODY=$(gh issue view "$ISSUE_NUMBER" --json body --jq .body)
          REPO=$(awk '/^\*\*Repository URL\*\*$/{getline; print}' <<<"$BODY" | grep -o 'https://github.com/[^ )]*' | head -1 || true)
          if [ -z "$REPO" ]; then
            echo "::error::no repository URL in issue #$ISSUE_NUMBER"
            gh issue comment "$ISSUE_NUMBER" --body "No **Repository URL** field found in this issue - nothing to research."
            exit 1
          fi
          SLUG=$(sed -e 's#https://github.com/##' -e 's#/$##' -e 's#\.git$##' <<<"$REPO")
          echo "repo=$SLUG" >> "$GITHUB_OUTPUT"
          # duplicate: already in the catalog
          if python3 -c "
          import json,sys
          slug=sys.argv[1].lower()
          urls=[p['url'].lower().rstrip('/').removesuffix('.git') for p in json.load(open('catalog/projects.json'))['projects']]
          sys.exit(0 if 'https://github.com/'+slug in urls else 1)" "$SLUG"; then
            gh issue comment "$ISSUE_NUMBER" --body "\`$SLUG\` is already in the catalog (one entry per project - no duplicates). Closing."
            gh issue close "$ISSUE_NUMBER"
            echo "skip=duplicate" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          META=$(gh api "repos/$SLUG" --jq '{archived, pushed_at, stargazers_count, license: .license.spdx_id, language}' 2>/dev/null || echo '{}')
          echo "meta=$META"
          ARCHIVED=$(jq -r '.archived // false' <<<"$META")
          PUSHED=$(jq -r '.pushed_at // ""' <<<"$META")
          if [ "$ARCHIVED" = "true" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "SKIP: \`$SLUG\` is archived - no card drafted by the freshness gate."
            gh issue close "$ISSUE_NUMBER"
            echo "skip=archived" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$PUSHED" ]; then
            DAYS=$(( ( $(date -u +%s) - $(date -u -d "$PUSHED" +%s) ) / 86400 ))
            echo "last push $PUSHED (${DAYS}d ago)"
            if [ "$DAYS" -gt 365 ]; then
              gh issue comment "$ISSUE_NUMBER" --body "SKIP: \`$SLUG\` is stale (last push $PUSHED, ${DAYS}d ago) - no card drafted by the freshness gate."
              gh issue close "$ISSUE_NUMBER"
              echo "skip=stale" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "skip=" >> "$GITHUB_OUTPUT"
          echo "meta_json=$META" >> "$GITHUB_OUTPUT"
      - name: Research and draft the card text
        if: steps.gate.outputs.skip == ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          REPO_SLUG: ${{ steps.gate.outputs.repo }}
          REPO_META: ${{ steps.gate.outputs.meta_json }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_MODEL: glm-5.3-flash
          ANTHROPIC_SMALL_FAST_MODEL: glm-4.5-air
          ANTHROPIC_DEFAULT_SONNET_MODEL: glm-5.3-flash
          ANTHROPIC_DEFAULT_OPUS_MODEL: glm-5.3-flash
          ANTHROPIC_DEFAULT_HAIKU_MODEL: glm-4.5-air
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          API_TIMEOUT_MS: "3000000"
        run: |
          set -o pipefail
          ISSUE_TITLE=$(gh issue view "$ISSUE_NUMBER" --json title --jq .title)
          ISSUE_BODY=$(gh issue view "$ISSUE_NUMBER" --json body --jq .body)
          # Policy lives in docs/agents/intake.md so it is reviewable and
          # reusable; the task below carries only this run's payload.
          SYSTEM=$(cat docs/agents/intake.md)
          PROMPT=$(cat <<EOF_ISSUE
          Draft a catalog card for this repository: ${REPO_SLUG}
          GitHub metadata already fetched for you: ${REPO_META}
          Issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}

          ${ISSUE_BODY}

          Study 2-3 existing cards in README.md first. The house format is one line:
            - [name](url) - what it is, one dense sentence. **Blazing:** the measurement with real numbers, the named baseline, and a methodology link. **Type:** measured|tool|case-study. **Arch:** \`tag\`, \`tag\`.
          Rules for the line: numbers with context ("12x vs X at 96 threads", not "very fast"); every link must be one you actually opened; tags must come from PATTERNS.md.

          Then return ONLY this JSON object (no fences, no prose around it):
          {"skip": null or "short reason the project does not fit the catalog",
           "card": "the single card line, or empty when skip is set",
           "what": "2 short sentences: what the project is, in words a reader who has never seen it understands",
           "why": "2 short sentences: which numbers convinced you, and what they were compared against",
           "weak": "2 short sentences: what a reviewer should double-check, and what the evidence does not cover"}

          Quality bar: if the benchmark evidence is weak or missing, still draft the card with **Type:** case-study and say what is missing in the Blazing line. Skip only when the project is not Rust or has no verifiable speed claim at all.

          Write the three prose fields for a reviewer who is tired and in a hurry: short sentences, plain words, no jargon, no abbreviations you have not explained. Say what a thing is before saying whether it is fast.

          Budget: at most 8 tool calls. Read the repo README and ONE benchmark document, then write the card - a large repository is not a reason to keep reading.
          EOF_ISSUE
          )
          ATTEMPT_TIMEOUT=600
          run_agent() {
            timeout $ATTEMPT_TIMEOUT claude -p "$PROMPT" \
              --append-system-prompt "$SYSTEM" \
              --permission-mode dontAsk \
              --allowedTools "Read,Grep,Glob,Bash(gh api *),Bash(gh repo view *)" \
              --max-turns 20 \
              --output-format json \
              | jq -r '.result // empty'
          }
          set +e
          OUT=$(run_agent); RC=$?
          if [ "$RC" = 124 ]; then
            echo "::warning::research hit the ${ATTEMPT_TIMEOUT}s cap"
          fi
          # Retry only the recoverable case: the session came up without its
          # tool registry and answered without a single JSON object. A timeout
          # is not retried - it would just burn the job budget twice.
          if [ "$RC" = 0 ] && ! grep -q '"card"' <<<"$OUT"; then
            echo "first attempt had no card object; retrying once"
            OUT=$(run_agent); RC=$?
          fi
          set -e
          if [ -z "$OUT" ]; then
            echo "::warning::agent returned no output (rc=$RC)"
          fi
          printf '%s\n' "$OUT" > agent-result.md
          python3 - <<'PYEOF'
          import json, re, sys
          raw = open('agent-result.md').read()
          start, end = raw.find('{'), raw.rfind('}')
          data = None
          if 0 <= start < end:
              try:
                  data = json.loads(raw[start:end+1], strict=False)
              except Exception:
                  data = None
          if not isinstance(data, dict):
              open('card.json','w').write('{"skip": null, "card": "", "what": "", "why": "", "weak": "the agent returned no parsable JSON"}')
              print('AGENT OUTPUT NOT VALID JSON - see agent-result.md')
              sys.exit(0)
          json.dump(data, open('card.json','w'))
          print(json.dumps(data, ensure_ascii=False)[:600])
          PYEOF
      - name: Insert the card and run the gates
        if: steps.gate.outputs.skip == ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          set -o pipefail
          CARD=$(jq -r '.card // ""' card.json)
          SKIP=$(jq -r '.skip // ""' card.json)
          if [ -n "$SKIP" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "Agent verdict: **does-not-fit** - $SKIP"
            gh issue close "$ISSUE_NUMBER"
            echo "skip=agent" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -z "$CARD" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "The research agent produced no card this run (no parsable JSON after one retry) - see the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            exit 1
          fi
          # Structural check before the card touches README: house markers present.
          for marker in '**Blazing:**' '**Type:**' '**Arch:**'; do
            grep -qF "$marker" <<<"$CARD" || { echo "::error::card is missing $marker"; exit 1; }
          done
          grep -q '^- \[' <<<"$CARD" || { echo "::error::card is not a '- [name](url)' line"; exit 1; }
          python3 - <<'PYEOF'
          import re
          card = __import__('json').load(open('card.json'))['card'].strip()
          readme = open('README.md').read()
          marker = '## Candidates'
          i = readme.index(marker)
          end = readme.find('\n## ', i + len(marker))
          end = len(readme) if end == -1 else end
          block = readme[i:end].rstrip('\n')
          readme = readme[:i] + block + '\n' + card + '\n\n' + readme[end:].lstrip('\n')
          open('README.md','w').write(readme)
          print('card inserted into Candidates')
          PYEOF
          ./cli/target/release/abr catalog
          ./cli/target/release/abr patterns
          ./cli/target/release/abr llms
          echo "### Gates (run in the pipeline at this commit)" > gates.md
          FAIL=0
          if ./cli/target/release/abr check > gate-abr.log 2>&1; then
            echo "- \`abr check\` - pass" >> gates.md
          else
            echo "- \`abr check\` - **FAIL**" >> gates.md; FAIL=1
          fi
          if npx -y awesome-lint readme.md > gate-awesome.log 2>&1; then
            echo "- \`awesome-lint\` - pass" >> gates.md
          else
            echo "- \`awesome-lint\` - **FAIL**" >> gates.md; FAIL=1
          fi
          if [ "$FAIL" != 0 ]; then
            {
              echo "The card failed a deterministic gate, so no PR was opened."
              echo
              cat gates.md
              echo
              echo '```'
              tail -n 40 gate-abr.log gate-awesome.log 2>/dev/null
              echo '```'
            } > gate-comment.md
            gh issue comment "$ISSUE_NUMBER" --body-file gate-comment.md
            exit 1
          fi
          jq -r '.what // ""' card.json > pr-what.md
          jq -r '.why // ""' card.json > pr-why.md
          jq -r '.weak // ""' card.json > pr-weak.md
          NAME=$(jq -r '.card' card.json | sed -n 's/^- \[\([^]]*\)\].*/\1/p')
          ./cli/target/release/abr verify --only "$NAME" > pr-verify.log 2>&1 || true
          head -2 pr-verify.log > pr-verify.md
          cat pr-verify.md
          cat gates.md
      - name: Open draft PR
        if: steps.gate.outputs.skip == ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          if git diff --quiet -- README.md; then
            echo "no card in the tree (agent skipped or failed) - nothing to open"
            exit 0
          fi
          BRANCH="agent/card-${ISSUE_NUMBER}-${{ github.run_id }}"
          # Base the branch on CURRENT main: a card run takes minutes, and a
          # branch lagging behind main shows the workflow files as reverted,
          # which GitHub rejects for a GitHub App push.
          git stash push -q -- README.md catalog PATTERNS.md llms.txt
          git fetch -q origin main
          git checkout -B "$BRANCH" origin/main
          git stash pop -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md catalog PATTERNS.md llms.txt
          git commit -qm "Draft card from issue #${ISSUE_NUMBER}"
          git push origin "$BRANCH"
          {
            echo "Draft card from #${ISSUE_NUMBER}."
            echo
            echo "## What this is"
            echo
            cat pr-what.md
            echo
            echo "## Why it belongs in the catalog"
            echo
            cat pr-why.md
            echo
            echo "## What to check before merging"
            echo
            cat pr-weak.md
            echo
            echo "## The card"
            echo
            echo '```'
            jq -r '.card' card.json
            echo '```'
            echo
            echo "## Numbers against the source"
            echo
            echo '```'
            cat pr-verify.md
            echo '```'
            echo
            echo "\`OK\` means every number in the claim was found in the page the card"
            echo "links. \`MISS\` means some were not: they may sit in a chart, a PDF or"
            echo "another file, so look before deciding."
            echo
            echo "## Automatic gates"
            echo
            cat gates.md
            echo
            echo "Closes #${ISSUE_NUMBER}"
          } > pr-body.md
          gh pr create --title "Card draft from issue #${ISSUE_NUMBER}" \
            --body-file pr-body.md --head "$BRANCH" --label card-draft
          gh issue comment "$ISSUE_NUMBER" --body "Draft PR opened: ${{ github.server_url }}/${{ github.repository }}/pull/$(gh pr view --json number -q .number) - a maintainer review merges it into the catalog."
      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intake-run
          path: |
            agent-result.md
            card.json
            gates.md

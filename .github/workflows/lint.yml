name: Lint

on:
  push:
    branches: [main]
    paths: ["**.md", "llms.txt", "catalog/**", "cli/**", "runs/**", ".github/**"]
  pull_request:
    paths: ["**.md", "llms.txt", "catalog/**", "cli/**", "runs/**", ".github/**"]
  workflow_dispatch:

jobs:
  awesome-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y awesome-lint readme.md

  abr-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Consistency check (catalog / patterns / llms)
        run: |
          cd cli
          cargo build --release
          cargo test
          cd ..
          ./cli/target/release/abr check
      - name: Projections are deterministic
        run: |
          ./cli/target/release/abr catalog && ./cli/target/release/abr patterns && ./cli/target/release/abr llms
          git diff --exit-code -- catalog PATTERNS.md llms.txt
      - name: runs/ experiments still compile
        run: |
          while IFS= read -r manifest; do
            d="$(dirname "$manifest")"
            echo "cargo check: $d"
            (cd "$d" && cargo check --release --quiet) || exit 1
          done < <(find runs -name Cargo.toml)

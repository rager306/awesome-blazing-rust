name: Intake reconcile report

# Reporting only: neither discovery dispatch failures nor missing PRs prove that
# an intake did not start. A maintainer must inspect Actions before any retry.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Report open intake issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/intake_reconcile.py >> "$GITHUB_STEP_SUMMARY"

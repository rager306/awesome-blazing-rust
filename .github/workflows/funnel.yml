name: Funnel

# Weekly discovery funnel: who found what, and what survived the gates.
# Deterministic pipeline (no LLM): reads the GitHub API only, so the numbers
# are reproducible and cheap. Posts a single "Discovery funnel" issue that is
# updated in place instead of a new one each week.
#
# Columns answer one question: which search provider earns its free tier?
#   found   = intake issues (labelled per provider in the issue body, "Found via")
#   drafted = intake issues referenced by at least one card-draft PR
#   merged  = intake issues referenced by at least one merged card-draft PR
# A provider that never passes drafted/merged is noise, not discovery.

on:
  schedule:
    - cron: "23 8 * * 1" # Mondays 08:23 UTC, after the daily discovery run
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read # counting card-draft PRs is the other half of the funnel

concurrency:
  group: funnel
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the funnel table
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e -o pipefail
          gh issue list --label card-intake --state all --limit 500 \
            --json number,title,state,body,createdAt,closedAt > intakes.json
          gh pr list --label card-draft --state all --limit 500 \
            --json number,title,state,mergedAt > drafts.json
          python3 - <<'PYEOF'
          import json, re, collections, datetime
          intakes = json.load(open('intakes.json'))
          drafts = json.load(open('drafts.json'))

          def provider(body):
              m = re.search(r'\*\*Found via\*\*\s*\n\s*(\S+)', body or '')
              return m.group(1).strip().lower() if m else 'unknown'

          found = collections.Counter(provider(i['body']) for i in intakes)

          # Count each intake once per stage, even when it has multiple PRs.
          issue_provider = {str(i['number']): provider(i['body']) for i in intakes}
          drafted_issues, merged_issues = set(), set()
          for p in drafts:
              m = re.search(r'issue #(\d+)', p['title'])
              if not m or m.group(1) not in issue_provider:
                  continue
              issue_number = m.group(1)
              drafted_issues.add(issue_number)
              if p['mergedAt']:
                  merged_issues.add(issue_number)
          drafted_by = collections.Counter(issue_provider[n] for n in drafted_issues)
          merged_by = collections.Counter(issue_provider[n] for n in merged_issues)

          rows = []
          for prov in sorted(found, key=lambda p: (-found[p], p)):
              f, d, g = found[prov], drafted_by[prov], merged_by[prov]
              rows.append(f'| {prov} | {f} | {d} | {g} | '
                          f'{(100 * d // f) if f else 0}% |'
                          f' {(100 * g // f) if f else 0}% |')

          total = len(intakes)
          body = [
              '## Discovery funnel',
              '',
              f'Generated {datetime.datetime.now(datetime.UTC):%Y-%m-%d} from '
              f'{total} intake issues and {len(drafts)} card-draft PRs.',
              'Each list is capped at 500; additional issues or PRs may be omitted. '
              'Rates apply only to these retrieved records.',
              '',
              '| Provider | found (issues) | drafted (issues) | merged (issues) | draft rate | merge rate |',
              '| --- | --- | --- | --- | --- | --- |',
              *rows,
              '',
              'A low draft rate in these retrieved records may warrant reviewing '
              'the provider and its queries. This report does not establish why '
              'an issue did not reach a later stage.',
              '',
              '_Deterministic report: numbers come from issue bodies and PR '
              'titles only._',
          ]
          open('funnel.md', 'w').write('\n'.join(body) + '\n')
          print('\n'.join(body))
          PYEOF
      - name: Update or open the funnel issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list --label discovery-funnel --state open --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file funnel.md
          else
            # The label is repo config, not code: create it on demand so a fresh
            # clone or a deleted label cannot turn the report into a failed run.
            gh label create discovery-funnel --description "Weekly discovery funnel report" --color 0e8a16 --force >/dev/null 2>&1 || true
            gh issue create --title "Discovery funnel: week of $(date -u +%G-W%V)" --body-file funnel.md --label discovery-funnel
          fi
